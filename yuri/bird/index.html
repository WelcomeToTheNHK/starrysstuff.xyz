<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>birb</title>
<style>
  body { margin:0; width:100%; height:100%; overflow:hidden; }
  #Canvas {
    position:relative;
    width:100%; height:100vh;
    background-image: url('https://static.wikia.nocookie.net/doki-doki-literature-club/images/5/50/Club.png/revision/latest?cb=20171231181915');
    background-size:cover; background-position:center;
  }
  #Birdy {
    width:4.5%;
    position:absolute;
    top:50%; left:20%;
    transform-origin:center center;
    pointer-events:none;
    z-index:150;
  }
  .Pipe {
    position:absolute;
    top:0; left:100%;
    width:9%;
    overflow:hidden;
    z-index:5;
  }
  .Pipe img {
    width:100%; height:100%;
    object-fit:cover; object-position:center top;
    display:block;
  }
  .Pipe.flipped img { transform:scaleY(-1); }
  #CurrentScoreCard {
    position:absolute;
    top:18px; width:100%; text-align:center;
    font-size:clamp(28px,6vw,52px); font-weight:bold;
    color:#fff; font-family:Georgia,serif;
    text-shadow:0 0 8px rgba(0,0,0,0.9),2px 2px 0 rgba(0,0,0,0.7);
    pointer-events:none; z-index:200;
  }
  #LostScoreScreen {
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%);
    background:rgba(20,8,35,0.88);
    border:2px solid #9b59b6;
    border-radius:12px;
    padding:24px 36px;
    text-align:center;
    font-family:Georgia,serif; color:#fff;
    z-index:200; display:none;
    min-width:260px;
  }
  #LostScoreScreen h2 { font-size:clamp(20px,4vw,32px); margin-bottom:8px; color:#ff9ac1; }
  #LostScoreScreen p  { font-size:clamp(12px,2vw,16px); font-style:italic; opacity:0.8; margin:6px 0 14px; max-width:320px; }
  #LostScoreScreen .nums { font-size:clamp(14px,2.5vw,20px); margin-bottom:16px; }
  #ResetButton {
    padding:10px 28px; background:#9b59b6; border:none;
    border-radius:20px; color:#fff; font-size:16px;
    font-family:Georgia,serif; cursor:pointer;
  }
  #ResetButton:hover { background:#6c3483; }
  #StartScreen {
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%);
    text-align:center; font-family:Georgia,serif; color:#fff;
    text-shadow:0 0 12px rgba(0,0,0,0.95),2px 2px 0 rgba(0,0,0,0.8);
    pointer-events:none; z-index:200;
  }
  #StartScreen h1 { font-size:clamp(26px,5vw,46px); margin-bottom:10px; }
  #StartScreen p  { font-size:clamp(13px,2vw,18px); opacity:0.75; }
</style>
</head>
<body>
<div id="Canvas">
  <div id="StartScreen">
    <h1>Le Epic Bird Game</h1>
    <p>click or space to flap</p>
  </div>
  <div id="CurrentScoreCard" style="display:none">0</div>
  <div id="LostScoreScreen">
    <h2 id="DeathTitle">you fell...</h2>
    <p id="DeathQuote"></p>
    <div class="nums">score: <b id="FinalScore">0</b> &nbsp;•&nbsp; best: <b id="BestScore">0</b></div>
    <button id="ResetButton">try again</button>
  </div>
  <img id="Birdy"
    src="https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/f/21cde320-1c91-4c66-824b-d25f0c226f28/dc28pa7-aee4e54a-1cbe-44de-a11a-74c9e9a901f3.png?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1cm46YXBwOjdlMGQxODg5ODIyNjQzNzNhNWYwZDQxNWVhMGQyNmUwIiwiaXNzIjoidXJuOmFwcDo3ZTBkMTg4OTgyMjY0MzczYTVmMGQ0MTVlYTBkMjZlMCIsIm9iaiI6W1t7InBhdGgiOiIvZi8yMWNkZTMyMC0xYzkxLTRjNjYtODI0Yi1kMjVmMGMyMjZmMjgvZGMyOHBhNy1hZWU0ZTU0YS0xY2JlLTQ0ZGUtYTExYS03NGM5ZTlhOTAxZjMucG5nIn1dXSwiYXVkIjpbInVybjpzZXJ2aWNlOmZpbGUuZG93bmxvYWQiXX0.zi5Y2DogrDFaxfkzow7MJCkSJ_W5cjp2P-CAYDc_I7U"
    alt="Yuri">
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
$(function(){
  const PIPE_IMG = 'https://static.wikia.nocookie.net/yandere/images/8/82/Yuri_profile.png/revision/latest?cb=20251005191907';

  const QUOTES = [
    "lol imagine dying",
    "i- its not like i like you or anything!",
    "source at https://github.com/WelcomeToTheNHK/starrysstuff.xyz/",
    "fun isnt it?",
    "hope you didnt lose too much",
    "Monika is glad",
    "How could you do this to Yuri...",
    "just be better bro",
  ];
  const DEATH_TITLES = [
    'you fell...','oh no...','how poetic.','I-it\'s okay...','lol u bad','u helping monika or sum?'
  ];
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

  const canvasObj = $('#Canvas');
  const birdyEl   = $('#Birdy');

  let gameLoopID = 0;
  let paused     = true;
  let lost       = false;
  let started    = false;
  let currentScore = 0, bestScore = 0;
  let gameLoopCounter = 0;

  const Birdy = new (function(){
    const sel       = birdyEl;
    let jumping     = false;
    let gravVeloc   = 0;
    const gravAccel = 0.25;       
    const termVel   = 4;          
    let angle       = 0;

    this.reset = function(){
      jumping=false; gravVeloc=0; angle=0;
      sel.stop(true).css({top:'50%', transform:'rotate(-90deg)'});
    };

    this.fall = function(){
      if(!jumping){
        sel.stop(true).animate({top:'+='+gravVeloc+'%'}, 30, 'linear');
        gravVeloc = Math.min(gravVeloc+gravAccel, termVel);
        const tilt = -90 + Math.min(90, 15*(gravVeloc/termVel)**2 * 57.3 * 0.05);
        sel.css('transform','rotate('+tilt+'deg)');
      } else {
        gravVeloc = 0;
      }
    };

    this.jump = function(){
      if(paused) return;
      jumping = true;
      sel.stop(true).css('transform','rotate(-135deg)')
        .animate({top:'-=9%'}, 150, 'linear', function(){
          jumping = false;
          Birdy.fall();
        });
    };

    this.dropOut = function(){
      sel.stop(true).animate({top:'92%'}, 1200, 'linear');
    };

    this.el = sel;
  });

  // ── Pipes ────────────────────────────────────────────────────────────────
  function addPipe(){
    const gapPct    = 28;
    const minH      = 6;
    const maxTopH   = 100 - gapPct - 2*minH;
    const topH      = Math.random()*maxTopH + minH;
    const botTop    = topH + gapPct;
    const botH      = 100 - botTop;

    // top pipe (flipped image)
    $('<div>').addClass('Pipe flipped')
      .css('height', topH+'%')
      .data('scored', false)
      .append($('<img>').attr('src', PIPE_IMG))
      .appendTo(canvasObj)
      .animate({left:'-25%'}, 3500, 'linear', function(){ $(this).remove(); });

    // bottom pipe
    $('<div>').addClass('Pipe BottomPipe')
      .css({height: botH+'%', top: botTop+'%'})
      .data('scored', false)
      .append($('<img>').attr('src', PIPE_IMG))
      .appendTo(canvasObj)
      .animate({left:'-25%'}, 3500, 'linear', function(){ $(this).remove(); });
  }

  // ── Collision ─────────────────────────────────────────────────────────────
  function isIntersecting(a, b){
    const ar=a[0].getBoundingClientRect(), br=b[0].getBoundingClientRect();
    // shrink bird rect by 30% for forgiveness
    const margin = ar.width*0.28;
    const al=ar.left+margin, at=ar.top+margin, aright=ar.right-margin, ab=ar.bottom-margin;
    return !(ab<br.top || at>br.bottom || al>br.right || aright<br.left);
  }

  function checkCollisions(){
    let hit=false;
    $('.Pipe').each(function(){
      if(isIntersecting(Birdy.el, $(this))) hit=true;
    });
    if(hit) endGame();
  }

  function isInBound(){
    const br=Birdy.el[0].getBoundingClientRect();
    const cr=canvasObj[0].getBoundingClientRect();
    if(br.bottom>cr.bottom || br.top<cr.top) endGame();
  }

  // ── Score ─────────────────────────────────────────────────────────────────
  function incrementScore(){
    $('.BottomPipe').each(function(){
      const birdRight = Birdy.el.offset().left + Birdy.el.width();
      const pipeRight = $(this).offset().left   + $(this).width();
      if(!$(this).data('scored') && birdRight>pipeRight){
        $(this).data('scored',true);
        currentScore++;
        $('#CurrentScoreCard').text(currentScore);
      }
    });
  }

  // ── Game loop ─────────────────────────────────────────────────────────────
  function gameLoop(){
    gameLoopCounter++;
    if(gameLoopCounter%2===0){ incrementScore(); checkCollisions(); }
    isInBound();
    Birdy.fall();
    if(gameLoopCounter%55===0) addPipe();
  }

  function startLoop(){
    if(lost) return;
    gameLoopID = setInterval(gameLoop, 30);
    paused=false;
  }

  function stopLoop(){
    clearInterval(gameLoopID);
    paused=true;
  }

  function endGame(){
    if(lost) return;
    lost=true;
    stopLoop();
    if(currentScore>bestScore) bestScore=currentScore;
    Birdy.dropOut();
    $('#FinalScore').text(currentScore);
    $('#BestScore').text(bestScore);
    $('#DeathTitle').text(pick(DEATH_TITLES));
    $('#DeathQuote').text('"'+pick(QUOTES)+'"');
    setTimeout(()=>{ $('#LostScoreScreen').fadeIn(300); }, 900);
  }

  function resetGame(){
    stopLoop();
    lost=false; started=true;
    currentScore=0; gameLoopCounter=0;
    $('.Pipe').stop(true).remove();
    Birdy.reset();
    $('#LostScoreScreen').hide();
    $('#CurrentScoreCard').text('0').show();
    startLoop();
  }

  // ── Input ─────────────────────────────────────────────────────────────────
  canvasObj.on('mousedown touchstart', function(e){
    e.preventDefault();
    if(!started){
      // first click: start game
      started=true;
      $('#StartScreen').fadeOut(200);
      $('#CurrentScoreCard').text('0').show();
      startLoop();
      return;
    }
    if(lost) return;
    Birdy.jump();
  });

  $(document).on('keydown', function(e){
    if(e.which===32){
      e.preventDefault();
      if(!started){
        started=true;
        $('#StartScreen').fadeOut(200);
        $('#CurrentScoreCard').text('0').show();
        startLoop();
        return;
      }
      if(lost) return;
      Birdy.jump();
    }
  });

  $('#ResetButton').on('click', function(e){
    e.stopPropagation();
    resetGame();
  });
});
</script>
</body>
</html>
