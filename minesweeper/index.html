<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yuri Minesweeper</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Trebuchet MS",Verdana,sans-serif;user-select:none;-webkit-user-select:none}
img{-webkit-user-drag:none;pointer-events:none}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;overflow:hidden;transform-origin:center;background:#fff;touch-action:manipulation}
.bg{position:absolute;inset:0;width:100%;height:100%}
.screen{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .5s}
.screen.on{opacity:1;pointer-events:auto}
#home{background:#ffd9ee radial-gradient(circle,#ffc0e2 7px,transparent 8px) 0 0/52px 52px;text-align:center;z-index:30}
h1{margin:70px 0 6px;font-size:84px;color:#fff;letter-spacing:2px;-webkit-text-stroke:10px #ff7cbf;paint-order:stroke fill}
.sub{color:#b0306f;font-size:24px;margin:0 0 44px;font-weight:bold}
.lbl{color:#b0306f;font-weight:bold;font-size:22px;margin-bottom:14px}
#diffs{display:flex;justify-content:center;gap:14px}
.d{width:210px;padding:14px 6px;background:#fff;border:3px solid #ffa6d5;border-radius:12px;color:#b0306f;cursor:pointer;font:inherit;transition:.15s}
.d b{display:block;font-size:24px;margin-bottom:2px}.d small{font-size:15px;color:#c0679a;line-height:1.35}
.d:hover{background:#ffeaf5}.d.sel{background:#ff7cbf;border-color:#ff5aa9;color:#fff}.d.sel small{color:#fff}
.btn{margin-top:40px;padding:14px 56px;font-size:30px;font-weight:bold;color:#fff;background:#ff7cbf;border:4px solid #fff;border-radius:40px;cursor:pointer;box-shadow:0 0 0 3px #ff7cbf;font-family:inherit}
.btn:hover{background:#ff5aa9}
.fan{position:absolute;bottom:14px;width:100%;color:#c0679a;font-size:14px}
/* game */
.pill{position:absolute;top:18px;padding:6px 22px;background:rgba(255,238,248,.92);border:3px solid #ff9ad0;border-radius:14px;color:#b0306f;font-size:24px;font-weight:bold;font-family:inherit}
button.pill{cursor:pointer}button.pill.on{background:#ff7cbf;color:#fff}
#mute{position:absolute;right:24px;top:14px;width:52px;height:52px;border-radius:50%;border:3px solid #fff;background:#ff7cbf;color:#fff;font-size:24px;cursor:pointer;z-index:20}
#board{position:absolute;left:0;right:0;top:76px;display:flex;justify-content:center}
#grid{display:grid;gap:2px;padding:10px;background:rgba(255,238,248,.85);border:3px solid #ff9ad0;border-radius:14px}
.c{box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-weight:bold;background:linear-gradient(#ffb7de,#ff8cc6);border:2px solid #fff;border-radius:6px;cursor:pointer;overflow:hidden}
.c:hover{filter:brightness(1.08)}
.c.r{background:#fff6fb;border-color:#ffd6ea;cursor:default;filter:none}
.c img{width:90%;height:90%;object-fit:contain}
.c.boom{background:#ff6b8a}
.n1{color:#4a7bd0}.n2{color:#3a9a5b}.n3{color:#e0505a}.n4{color:#7a4fc0}.n5{color:#c0662a}.n6{color:#2a9aa0}.n7{color:#444}.n8{color:#888}
/* result */
#result{z-index:25;background:rgba(40,10,30,.35)}
#rs{position:absolute;left:0;bottom:0;width:100%;height:100%;object-fit:contain;object-position:bottom}
#tag{position:absolute;left:150px;bottom:200px;color:#fff;font-weight:bold;font-size:22px;padding:4px 26px;border-radius:10px 10px 0 0}
#box{position:absolute;left:120px;bottom:16px;width:1040px;height:195px;box-sizing:border-box;background:url(assets/textbox.png) center/100% 100% no-repeat;display:flex;align-items:center;padding:0 50px 6px;gap:30px;color:#fff;-webkit-text-stroke:5px #c0467f;paint-order:stroke fill}
#pct{font-size:72px;font-weight:bold;min-width:190px;text-align:center;-webkit-text-stroke:9px #c0467f}
#msg{flex:1;font-size:26px;line-height:1.3}#msg small{display:block;font-size:18px;margin-top:6px;-webkit-text-stroke:4px #c0467f}
#btns{display:flex;flex-direction:column;gap:10px}
#box .btn{margin:0;font-size:22px;padding:7px 30px;color:#d4468f;background:#fff;border:3px solid #c0467f;box-shadow:none;-webkit-text-stroke:0}#box .btn:hover{background:#ffe3f1}
</style></head><body>
<audio id="bgm" src="assets/poem_panic.mp3" loop preload="auto"></audio>
<div id="stage">
 <div id="game" class="screen">
  <img class="bg" src="assets/classroom_empty.png" alt="">
  <div class="pill" style="left:24px">Natsukis <span id="ml">0</span></div>
  <div class="pill" style="left:250px">Time <span id="tm">0</span></div>
  <button class="pill" id="fm" style="left:420px" title="Toggle flag mode (or right-click)">Flag: off</button>
  <button id="mute" title="Mute music">&#9835;</button>
  <div id="board"><div id="grid"></div></div>
 </div>
 <div id="result" class="screen">
  <img id="rs" alt=""><div id="tag"></div>
  <div id="box"><div id="pct"></div><div id="msg"></div><div id="btns"><button class="btn" id="again">Again</button><button class="btn" id="menu">Menu</button></div></div>
 </div>
 <div id="home" class="screen on">
  <h1>Yuri Minesweeper</h1><p class="sub">Clear the tiles. Don't wake Natsuki. Right-click to flag.</p>
  <div class="lbl">Difficulty</div><div id="diffs"></div>
  <button class="btn" id="play">Play</button>
  <div class="fan">Fan-made game. Not affiliated with Team Salvato.</div>
 </div>
</div>
<script>
addEventListener('dragstart',e=>e.preventDefault());
const $=id=>document.getElementById(id);
// name, columns, rows, Natsukis (mines), cell size
const D=[["Easy",9,9,10,60],["Normal",16,16,40,36],["Hard",30,16,99,36]];
const MAD='https://static.wikia.nocookie.net/doki-doki-literature-club/images/8/8b/Turnedaway4.png/revision/latest?cb=20171209181300';
let di=0,cfg,C,W,Hh,M,cells,started,over,flags,opened,t0,tick,flagMode=false,scale=1;
const bgm=$('bgm'),bonkA=new Audio('assets/bonk.mp3');bgm.volume=.4;
D.forEach((d,i)=>{const b=document.createElement('button');b.className='d';b.innerHTML=`<b>${d[0]}</b><small>${d[1]} x ${d[2]} tiles<br>${d[3]} Natsukis hiding</small>`;b.onclick=()=>{di=i;sync()};$('diffs').appendChild(b)});
const sync=()=>[...$('diffs').children].forEach((b,i)=>b.classList.toggle('sel',i==di));sync();
function fit(){scale=Math.min(innerWidth/1280,innerHeight/720);$('stage').style.transform=`translate(-50%,-50%) scale(${scale})`}
addEventListener('resize',fit);fit();

const nb=i=>{const x=i%W,y=i/W|0,o=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const X=x+dx,Y=y+dy;if((dx||dy)&&X>=0&&X<W&&Y>=0&&Y<Hh)o.push(Y*W+X)}return o};
function start(){
 cfg=D[di];[,W,Hh,M,C]=cfg;started=over=false;flags=opened=0;clearInterval(tick);$('tm').textContent=0;$('ml').textContent=M;
 const g=$('grid');g.innerHTML='';g.style.gridTemplateColumns=`repeat(${W},${C}px)`;g.style.fontSize=C*.55+'px';
 cells=[];for(let i=0;i<W*Hh;i++){const el=document.createElement('div');el.className='c';el.style.width=el.style.height=C+'px';g.appendChild(el);cells.push({el,m:0,n:0,r:0,f:0})}
 const pre=new Image();pre.referrerPolicy='no-referrer';pre.src=MAD;
 setFlagMode(false);show('game');music(true)}
function place(first){const ban=new Set([first,...nb(first)]),pool=[];cells.forEach((_,i)=>{if(!ban.has(i))pool.push(i)});
 for(let k=0;k<M;k++){const j=Math.random()*pool.length|0;cells[pool.splice(j,1)[0]].m=1}
 cells.forEach((c,i)=>c.n=nb(i).filter(j=>cells[j].m).length)}
function draw(i){const c=cells[i],e=c.el;e.className='c'+(c.r?' r'+(c.n&&!c.m?' n'+c.n:''):'');
 e.innerHTML=c.f&&!c.r?'<img src="assets/chibi_yuri.png" alt="">':(c.r&&c.m?'<img src="assets/natsuki_head.png" alt="">':(c.r&&c.n?c.n:''))}
function reveal(i){
 if(over)return;if(!started){started=true;place(i);t0=performance.now();tick=setInterval(()=>{$('tm').textContent=Math.floor((performance.now()-t0)/1000)},250)}
 const c=cells[i];if(c.f||c.r)return;
 if(c.m){c.r=1;draw(i);c.el.classList.add('boom');return lose()}
 const st=[i];while(st.length){const k=st.pop(),q=cells[k];if(q.r||q.f)continue;q.r=1;opened++;draw(k);if(!q.n)nb(k).forEach(j=>{if(!cells[j].r)st.push(j)})}
 if(opened==W*Hh-M)win()}
function flag(i){if(over)return;const c=cells[i];if(c.r)return;c.f^=1;flags+=c.f?1:-1;$('ml').textContent=M-flags;draw(i)}
function chord(i){const c=cells[i];if(!c.r||!c.n)return;const n=nb(i);if(n.filter(j=>cells[j].f).length==c.n)n.forEach(j=>reveal(j))}
$('grid').addEventListener('click',e=>{const el=e.target.closest('.c');if(!el||over)return;const i=cells.findIndex(c=>c.el==el);
 if(cells[i].r)chord(i);else if(flagMode)flag(i);else reveal(i)});
$('grid').addEventListener('contextmenu',e=>{e.preventDefault();const el=e.target.closest('.c');if(el)flag(cells.findIndex(c=>c.el==el))});
function setFlagMode(v){flagMode=v;$('fm').classList.toggle('on',v);$('fm').textContent='Flag: '+(v?'on':'off')}
$('fm').onclick=()=>setFlagMode(!flagMode);

const secs=()=>Math.max(1,Math.round((performance.now()-t0)/1000));
function bonk(){const a=bonkA.cloneNode();a.volume=.8;a.play().catch(()=>{})}
function finish(win){over=true;clearInterval(tick);music(false);
 const k='ms_best_'+di,t=win?secs():0;let best=0;
 try{best=+localStorage.getItem(k)||0;if(win&&(!best||t<best)){best=t;localStorage.setItem(k,best)}}catch(e){if(win)best=best?Math.min(best,t):t}
 setTimeout(()=>{const rs=$('rs');rs.onerror=()=>{rs.onerror=null;rs.src='assets/natsuki_full.png'};rs.referrerPolicy='no-referrer';rs.src=win?'assets/yuri_full.png':MAD;
  const tg=$('tag');tg.textContent=win?'Yuri':'Natsuki';tg.style.background=win?'#b58be8':'#ff7cbf';
  $('pct').textContent=win?t+'s':Math.round(100*opened/(W*Hh-M))+'%';
  $('msg').innerHTML=(win?"You found every one of them... I'm impressed.":"Hey! You stepped on me! Look where you're clicking!")+`<small>${cfg[0]} - ${win?'Cleared!':'Tiles cleared'} - Best time: ${best?best+'s':'none yet'}</small>`;
  show('result')},win?600:1300)}
function win(){cells.forEach((c,i)=>{if(c.m&&!c.f){c.f=1;draw(i)}});$('ml').textContent=0;finish(true)}
function lose(){bonk();cells.forEach((c,i)=>{if(c.m&&!c.f){c.r=1;draw(i)}});finish(false)}
function show(id){$('game').classList.toggle('on',id!='home');$('result').classList.toggle('on',id=='result');$('home').classList.toggle('on',id=='home')}
$('play').onclick=start;$('again').onclick=start;$('menu').onclick=()=>show('home');

let fade;
$('mute').onclick=()=>{bgm.muted=!bgm.muted;$('mute').style.opacity=bgm.muted?.55:1;$('mute').innerHTML=bgm.muted?'&times;':'&#9835;'};
function music(on){clearInterval(fade);if(on){bgm.volume=.4;bgm.currentTime=0;bgm.play().catch(()=>{})}else fade=setInterval(()=>{if(bgm.volume>.05)bgm.volume=Math.max(0,bgm.volume-.05);else{bgm.pause();clearInterval(fade)}},100)}
</script></body></html>
